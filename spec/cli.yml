# Generated by `shipyard gen-cli-manifest` — do not edit by hand.
# The CLI's documented command and flag grammar, recorded from its own help
# output. A diff here is a change to the public contract.
schema: https://chris-peterson.github.io/shipyard/cli-manifest.v1.json
version: 1
name: beacon
engine: argparse
usages:
- flags:
  - name: -h
  - name: --version
  - name: --color
    arg: auto|always|never
commands:
- name: show
  usages:
  - summary: show resolved signal state
- name: set
  usages:
  - summary: set an override
    args:
    - name: project|task
      choices:
      - project
      - task
    - name: value
    - name: value
      optional: true
      repeatable: true
- name: task
  usages:
  - summary: set task override
    args:
    - name: value
    - name: value
      optional: true
      repeatable: true
- name: status
  usages:
  - summary: enter a mode (pause|release|retro|done) with an optional note, or `dev` to leave one
    args:
    - name: dev|pause|release|retro|done
      choices:
      - dev
      - pause
      - release
      - retro
      - done
    - name: note
      optional: true
      repeatable: true
- name: project
  usages:
  - summary: set project override
    args:
    - name: value
    - name: value
      optional: true
      repeatable: true
- name: clear
  usages:
  - summary: clear overrides
    args:
    - name: project|task
      choices:
      - project
      - task
      optional: true
- name: pause
  usages:
  - summary: enter pause mode with an optional note
    args:
    - name: note
      optional: true
      repeatable: true
    flags:
    - name: --clear-screen
- name: statusline
  usages:
  - summary: '(internal) Claude Code status-line provider: the mode note + deliverable links'
- name: release
  usages:
  - summary: enter release mode (ship-it flow in progress) with an optional note
    args:
    - name: note
      optional: true
      repeatable: true
- name: retro
  usages:
  - summary: enter retro mode (post-work follow-up) with an optional note
    args:
    - name: note
      optional: true
      repeatable: true
- name: done
  usages:
  - summary: enter done mode (session complete, ready to hand off) with an optional note
    args:
    - name: note
      optional: true
      repeatable: true
- name: resume
  usages:
  - summary: drop the overrides and leave any mode
- name: reset
  usages:
  - summary: clear all session state
- name: render
  usages:
  - summary: re-render current state
- name: hook
  usages:
  - summary: (internal) handle a Claude Code hook event
    args:
    - name: event
    flags:
    - name: --kind
      arg: KIND
- name: completions
  usages:
  - summary: install or print shell completions
    args:
    - name: zsh
      optional: true
    flags:
    - name: --print
- name: install
  usages:
  - summary: run all install steps (wrapper, completions, + iTerm2 adapter if present)
    flags:
    - name: --dir
      arg: DIR
- name: refresh-iterm-profiles
  usages:
  - summary: re-render the iTerm2 dynamic profiles (applies a changed button label)
- name: layout
  usages:
  - summary: audit the app-wide iTerm2 fleet layout, or --write it
    flags:
    - name: --write
    - name: --yes
    - name: --keys
      arg: KEYS
- name: copy-url
  usages:
  - summary: copy the resolved URL to the clipboard via pbcopy
- name: open-url
  usages:
  - summary: 'open the session''s web view (config: statusbar.buttons.web.cmd)'
    args:
    - name: dir
      optional: true
- name: open-code
  usages:
  - summary: 'open a directory in the configured editor (config: statusbar.buttons.code.cmd)'
    args:
    - name: dir
      optional: true
- name: json
  usages:
  - summary: print the resolved session state as JSON
- name: wip
  usages:
  - summary: list active work streams across all beacon sessions (+ tack routes)
    flags:
    - name: --json
    - name: --since
      arg: WHEN
    - name: --all
    - name: --timing
- name: watch
  usages:
  - summary: live, person-facing work-stream view (recency feed; q to quit)
    flags:
    - name: --interval
      arg: SECS
    - name: --since
      arg: WHEN
    - name: --all
- name: serve
  usages:
  - summary: serve the wip payload on http://127.0.0.1, or manage the always-on unit
    args:
    - name: run|install|uninstall|status
      choices:
      - run
      - install
      - uninstall
      - status
      optional: true
    flags:
    - name: --port
      arg: PORT
- name: prune
  usages:
  - summary: remove per-session state for long-idle sessions
    flags:
    - name: --since
      arg: WHEN
- name: forget
  usages:
  - summary: remove per-session state for one session, by its per-pane hash
    args:
    - name: hash
- name: drop
  usages:
  - summary: remove one deliverable from this session's status-line row
    args:
    - name: ref
- name: export
  usages:
  - summary: emit a lossless JSON backup of all per-session state (joins to a tack export on claude_session_id)
    flags:
    - name: --out-file
      arg: FILE
    - name: --compress
- name: import
  usages:
  - summary: restore per-session state from a `beacon export` file (non-destructive unless --force)
    args:
    - name: file
    flags:
    - name: --force
- name: doctor
  usages:
  - summary: check the install and report recorded errors
    flags:
    - name: --since
      arg: WHEN
    - name: --json
- name: data-dir
  usages:
  - summary: print the resolved data dir
- name: shell-init
  usages:
  - summary: (internal) print shell/beacon.zsh's source-time values as zsh
