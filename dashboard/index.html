      .pip-lines { display: flex; flex-direction: column; padding: 0 0.75rem 0 1.85rem; }
      .pip-lines > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .pip-lines a { text-decoration: underline dashed; text-underline-offset: 3px; text-decoration-thickness: 1px; }

      /* The latest turn, revealed by a click on the head: Markdown, so a link is
         its label and not its address. */
      .pip-turn { display: none; padding: 0.3rem 0.75rem 0 1.85rem; color: var(--hint); overflow-wrap: anywhere; }
      .pip-row.expanded .pip-turn:not(:empty) { display: block; }
      .pip-turn .role { color: var(--faint); margin-right: 0.4rem; }
      .pip-turn a { color: var(--web); text-decoration: underline; text-underline-offset: 2px; }
      .pip-turn code { color: var(--fg); background: var(--raised); padding: 0 0.2rem; border-radius: 3px; }
      .pip-err { color: var(--blocked); padding: 0.15rem 0.75rem 0 1.85rem; }
      .pip-err:empty { display: none; }
      .pip-empty { color: var(--faint); text-align: center; padding: 1.4rem 0.5rem; }
      .pip-empty[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    `;

    const pip = { win: null, root: null, panels: new Map(), expanded: new Set() };
    const pipSupported = "documentPictureInPicture" in window;

    async function toggleTabStack() {
      if (pip.win) { pip.win.close(); return; }
      if (!pipSupported) return;
      const w = await documentPictureInPicture.requestWindow({ width: 560, height: 240 });
      pip.win = w;
      pip.panels = new Map();
      const doc = w.document;
      doc.title = "beacon · tab stack";
      const style = doc.createElement("style");
      style.textContent = PIP_CSS;
      doc.head.appendChild(style);
      const root = doc.createElement("div");
      root.className = "pip";
      root.innerHTML =
        '<div class="pip-head"><span class="brand">beacon</span> tab stack' +
        '<div class="pip-order" role="radiogroup" aria-label="Sort the sessions"><span class="order-label">sort</span><button type="button" role="radio" data-order="status">status</button><button type="button" role="radio" data-order="recency">recency</button></div>' +
        '<span class="pip-count"></span></div>' +
        '<div class="pip-list"></div>' +
        '<div class="pip-empty" hidden>No sessions in the window.</div>' +
        '<div class="pip-tip" hidden></div>';
      doc.body.appendChild(root);
      pip.root = root;
      root.querySelector(".pip-order").addEventListener("click", onOrderClick);
      paintOrder();
      setTabStackActive(true);
      // pagehide fires when the user closes the PiP window (or it's reclaimed);
      // drop our handles so the poll stops rendering into a dead window.
      w.addEventListener("pagehide", () => {
        pip.win = null; pip.root = null; setTabStackActive(false);
      });
      renderPip();
    }

    function setTabStackActive(on) {
      const btn = document.getElementById("tabstack");
      btn.classList.toggle("active", on);
      btn.title = on
        ? "Close the tab stack"
        : "Open the tab stack: every session's status panel, stacked in an always-on-top window";
    }

    function renderPip() {
      if (!pip.win || !pip.root) return;
      const sessions = (latest && latest.sessions) || [];
      const doc = pip.win.document;
      const list = pip.root.querySelector(".pip-list");
      // The dashboard's own list, in its order, with the same rule above the
      // parked and finished when the order is by status.
      const sorted = [...sessions].sort(byOrder);
      const firstStood = order === "status" ? sorted.findIndex(stoodDown) : -1;
      // Reuse the rule and tiles across renders, keyed (buffer-dom-rerenders): a
      // steady poll re-orders in place instead of rebuilding.
      const have = new Map([...list.children].map((c) => [c.dataset.key, c]));
      let prev = null;
      const place = (node) => {
        const anchor = prev ? prev.nextSibling : list.firstChild;
        if (node.parentNode !== list || node !== anchor) list.insertBefore(node, anchor);
        prev = node;
      };
      sorted.forEach((s, i) => {
        if (i === firstStood && i > 0) {
          const gap = have.get("gap") || doc.createElement("div");
          gap.dataset.key = "gap";
          gap.className = "pip-gap";
          gap.setAttribute("role", "separator");
          have.delete("gap");
          place(gap);
        }
        loadPanel(s);
        const key = "s:" + s.hash;
        const row = have.get(key) || buildPipRow(doc, s.hash);
        row.dataset.key = key;
        updatePipRow(row, s, (pip.panels.get(s.hash) || {}).data);
        have.delete(key);
        place(row);
      });
      for (const node of have.values()) node.remove();

      pip.root.querySelector(".pip-count").textContent = sessions.length ? String(sessions.length) : "";
      pip.root.querySelector(".pip-empty").hidden = sessions.length > 0;
      resizePip();
    }

    // WIP-22: a tile's status panel, read at most once per STATUS-06 poll
    // interval, and again at once when the record shows the session moved
    // (a mode, task, or branch change), so the tile never lags the card.
    const PANEL_MS = 15000;
    function loadPanel(s) {
      const sig = [s.mode && s.mode.name, s.mode && s.mode.note, s.task, s.branch].join("\x00");
      const entry = pip.panels.get(s.hash) || {};
      if (entry.pending || (entry.sig === sig && Date.now() - (entry.at || 0) < PANEL_MS)) return;
      entry.pending = true;
      entry.sig = sig;
      pip.panels.set(s.hash, entry);
      fetch("/panel/" + s.hash, { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => { entry.data = data; })
        .catch(() => {})
        .finally(() => { entry.pending = false; entry.at = Date.now(); renderPip(); });
    }

    // The status panel's own colors (hooks/status-panel.tsx), so a tile reads as
    // the band does.
    const PANEL_ANSI = {
      "31": "#ff5555", "32": "#50fa7b", "33": "#f1fa8c", "34": "#bd93f9",
      "35": "#ff79c6", "36": "#8be9fd", "37": "#f8f8f2", "90": "#6272a4",
    };
    const BRANCH_HUE = { default: "#8d98c4", clean: "#8be9fd", diverged: "#f1fa8c", untracked: "#ffb86c" };
    // A chip on the slab: the band lifted toward white, as the panel's lift() does.
    function liftHex(hex, by = 0.1) {
      const n = parseInt(hex.slice(1), 16);
      const ch = (shift) => { const v = (n >> shift) & 0xff; return Math.round(v + (255 - v) * by).toString(16).padStart(2, "0"); };
      return "#" + ch(16) + ch(8) + ch(0);
    }
    // Past this many cells, a shared column parts a label from its note more than it lines anything up (the panel's LEAD_SLACK).
    const LEAD_SLACK = 8;
    // Cells a short label takes, as the panel's cells() counts them.
    function cells(text) {
      let n = 0;
      for (const ch of text) { const cp = ch.codePointAt(0); n += cp === 0xfe0f ? 0 : cp >= 0x1f000 ? 2 : 1; }
      return n;
    }
    function xterm256(n) {
      if (n < 16 || n > 255) return undefined;
      const hex = (v) => v.toString(16).padStart(2, "0");
      if (n >= 232) { const v = 8 + 10 * (n - 232); return "#" + hex(v) + hex(v) + hex(v); }
      const step = [0, 95, 135, 175, 215, 255], i = n - 16;
      return "#" + hex(step[Math.floor(i / 36)]) + hex(step[Math.floor(i / 6) % 6]) + hex(step[i % 6]);
    }
    function withSgr(style, params) {
      let next = { ...style };
      const codes = (params === "" ? "0" : params).split(";");
      for (let i = 0; i < codes.length; i++) {
        const c = codes[i];
        if (c === "0") next = {};
        else if (c === "1") next.bold = true;
        else if (c === "2") next.dim = true;
        else if (c === "22") next.bold = next.dim = false;
        else if (c === "3") next.italic = true;
        else if (c === "23") next.italic = false;
        else if (c === "9") next.strike = true;
        else if (c === "29") next.strike = false;
        else if (c === "39") delete next.color;
        else if (c === "38" && codes[i + 1] === "5") { const x = xterm256(Number(codes[i + 2])); if (x) next.color = x; i += 2; }
        else if (PANEL_ANSI[c]) next.color = PANEL_ANSI[c];
      }
      return next;
    }
    // A status line's SGR runs and OSC 8 links, as the panel's segmentsOf reads them.
    function panelSegments(line) {
      const TOKEN = /\x1b\[([0-9;]*)m|\x1b\]8;;([^\x07\x1b]*)(?:\x07|\x1b\\)/g;
      const out = [];
      let style = {}, link = null, at = 0;
      const emit = (text) => {
        if (!text) return;
        const run = { text, style: { ...style } };
        if (link) link.runs.push(run); else out.push(run);
      };
      const close = () => {
        if (link) out.push({ href: link.href, label: link.runs.map((r) => r.text).join(""), runs: link.runs });
        link = null;
      };
      for (const m of line.matchAll(TOKEN)) {
        emit(line.slice(at, m.index));
        at = m.index + m[0].length;
        if (m[1] !== undefined) style = withSgr(style, m[1]);
        else if (m[2]) link = { href: m[2], runs: [] };
        else close();
      }
      emit(line.slice(at));
      close();
      return out;
    }
    function attrEscape(v) { return escapeHtml(v).replace(/"/g, "&quot;"); }
    // Only a web link opens from a tile: the lines are state-derived, and an
    // href is the one place they could carry a scheme of their own.
    function linkHtml(href, inner) {
      return /^https?:\/\//i.test(href)
        ? '<a href="' + attrEscape(href) + '" target="_blank" rel="noopener">' + inner + "</a>"
        : inner;
    }
    function runHtml(r) {
      const st = r.style, css = [];
      // Unstyled text stays dim, as the band draws it: the styled roles stand out.
      if (st.color) css.push("color:" + st.color);
      if (st.dim || (!st.bold && !st.color && !st.strike)) css.push("opacity:0.6");
      if (st.bold) css.push("font-weight:700");
      if (st.italic) css.push("font-style:italic");
      if (st.strike) css.push("text-decoration:line-through");
      return '<span style="' + css.join(";") + '">' + escapeHtml(r.text) + "</span>";
    }
    function segHtml(seg) {
      return "href" in seg ? linkHtml(seg.href, seg.runs.map(runHtml).join("")) : runHtml(seg);
    }

    // A tile's age, rounded to what a glance needs: the minute under an hour, the
    // hour under a day. A seconds count ticking on every poll pulls the eye to
    // the one number that matters least on a tile.
    function pipAge(s) {
      if (s == null) return "";
      const min = Math.round(s / 60);
      if (min < 1) return "<1 min";
      if (min < 60) return "~" + min + " min";
      const hr = Math.round(s / 3600);
      if (hr < 24) return "~" + hr + " hr";
      const day = Math.round(s / 86400);
      return "~" + day + (day === 1 ? " day" : " days");
    }

    function buildPipRow(doc, hash) {
      const row = doc.createElement("div");
      row.className = "pip-row";
      row.dataset.hash = hash;
      row.innerHTML =
        '<div class="pip-slab">' +
          '<div class="pip-moderow review" hidden><span class="rb-mode"></span><span class="rb-note"></span></div>' +
          '<div class="pip-moderow mode" hidden><span class="rb-mode"></span><span class="rb-note"></span></div>' +
          '<div class="pip-headrow">' +
            '<span class="pip-rdot"></span><span class="pip-proj"></span>' +
            '<button type="button" class="pip-btn go" data-tip="Raise its terminal window" hidden>go</button>' +
            '<span class="pip-age"></span>' +
            '<span class="pip-actions">' +
              '<button type="button" class="pip-btn web" data-tip="Open the project page" hidden></button>' +
              '<button type="button" class="pip-btn code" hidden></button>' +
            "</span></div>" +
          '<div class="pip-lines"></div><div class="pip-turn"></div><div class="pip-err"></div>' +
        "</div>";
      const headrow = row.querySelector(".pip-headrow");
      headrow.setAttribute("role", "button");
      headrow.tabIndex = 0;
      const toggle = () => {
        if (pip.expanded.has(hash)) pip.expanded.delete(hash); else pip.expanded.add(hash);
        row.classList.toggle("expanded", pip.expanded.has(hash));
        headrow.setAttribute("aria-expanded", String(pip.expanded.has(hash)));
        resizePip();
      };
      row.addEventListener("click", (e) => {
        // A link opens its page and a button does what its tip says; anywhere
        // else on the head row shows or hides the latest turn.
        if (e.target.closest("a")) return;
        const btn = e.target.closest(".pip-btn");
        if (btn) {
          if (btn.classList.contains("go")) focus(hash);
          else pressOpen(row, hash, btn.classList.contains("web") ? "web" : "code");
          return;
        }
        if (e.target.closest(".pip-headrow")) toggle();
      });
      headrow.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target === headrow) {
          e.preventDefault();
          toggle();
        }
      });
      // Each button says what it does the moment it's hovered or focused. The
      // tip is fixed to the window, so the tile's clipping never cuts it off.
      const tip = () => pip.root && pip.root.querySelector(".pip-tip");
      const showTip = (btn) => {
        const t = tip();
        if (!t || !btn.dataset.tip) return;
        t.textContent = btn.dataset.tip;
        t.hidden = false;
        const r = btn.getBoundingClientRect(), w = t.offsetWidth;
        t.style.left = Math.max(4, Math.min(r.right - w, doc.documentElement.clientWidth - w - 4)) + "px";
        t.style.top = Math.max(4, r.top - t.offsetHeight - 4) + "px";
      };
      const hideTip = () => { const t = tip(); if (t) t.hidden = true; };
      for (const btn of row.querySelectorAll(".pip-btn")) {
        btn.addEventListener("mouseenter", () => showTip(btn));
        btn.addEventListener("focus", () => showTip(btn));
        btn.addEventListener("mouseleave", hideTip);
        btn.addEventListener("blur", hideTip);
      }
      return row;
    }

    // WIP-23: the band's web and code buttons, pressed for this tile's session.
    async function pressOpen(row, hash, target) {
      const err = row.querySelector(".pip-err");
      try {
        const r = await fetch("/open", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hash, target }),
        });
        const j = await r.json();
        err.textContent = j.opened ? "" : (j.detail || "open failed");
      } catch (e) { err.textContent = "open request failed"; }
      if (err.textContent) setTimeout(() => { err.textContent = ""; resizePip(); }, 5000);
      resizePip();
    }

    function setHtml(el, html) {
      if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
    }

    function updatePipRow(row, s, panel) {
      // Until the panel arrives, the tile draws what the sessions record says.
      const mode = panel ? panel.mode : (s.mode && s.mode.name !== "dev" ? s.mode : null);
      const modeBand = panel && mode && mode.band;
      // STATUS-04: a held review leads the slab and gives it its hue, as its glyph leads the tab.
      const review = (panel && panel.review) || null;
      const band = review ? review.band : modeBand;
      // A parked or finished tile folds to its head row; a held review wants the user, so never.
      const folded = !!modeBand && stoodDown(s) && !review;
      row.className = "pip-row color-" + (s.color_state || "idle")
        + (band ? " moded" : "") + (folded ? " stood-down" : "")
        + (pip.expanded.has(s.hash) ? " expanded" : "");
      if (band) {
        row.style.setProperty("--mode-band", band);
        row.style.setProperty("--chip", liftHex(band));
      } else {
        row.style.removeProperty("--chip");
      }
      const headrow = row.querySelector(".pip-headrow");
      headrow.setAttribute("aria-expanded", String(pip.expanded.has(s.hash)));

      // The slab's first row, as the band draws it: glyph and label bold, then the note.
      const reviewrow = row.querySelector(".pip-moderow.review");
      reviewrow.hidden = !review;
      const reviewLabel = review ? review.glyph + " " + review.label : "";
      if (review) {
        setHtml(reviewrow.querySelector(".rb-mode"), escapeHtml(reviewLabel));
        setHtml(reviewrow.querySelector(".rb-note"), review.href ? linkHtml(review.href, escapeHtml(review.target)) : escapeHtml(review.target));
      }
      const moderow = row.querySelector(".pip-moderow.mode");
      moderow.hidden = !modeBand;
      const modeLabel = modeBand ? (mode.glyph ? mode.glyph + " " : "") + (mode.label || mode.name) : "";
      if (modeBand) {
        const note = mode.note_line
          ? panelSegments(mode.note_line).map((r) => "href" in r ? "" :
              '<span style="' + (r.style.bold ? "font-weight:700;color:var(--fg);" : "") + (r.style.italic ? "font-style:italic" : "") + '">'
              + escapeHtml(r.text) + "</span>").join("")
          : escapeHtml(mode.note || "");
        setHtml(moderow.querySelector(".rb-mode"), escapeHtml(modeLabel));
        setHtml(moderow.querySelector(".rb-note"), note);
      }
      // The buttons dock on whichever row opens the tile.
      const actions = row.querySelector(".pip-actions");
      const dock = review ? reviewrow : modeBand && !folded ? moderow : headrow;
      if (actions.parentNode !== dock) dock.appendChild(actions);

      row.querySelector(".pip-btn.go").hidden = !s.focusable;

      const lines = ((panel && panel.lines) || []).map(panelSegments);
      const links = new Map();
      for (const segs of lines) for (const g of segs) if ("href" in g && !links.has(g.label)) links.set(g.label, g.href);
      const project = (panel ? panel.project : s.project) || s.project || s.hash;
      const branch = panel ? panel.branch : s.branch;
      const task = (panel ? panel.task : s.task) || null;
      const parts = [...new Set([project, branch, task].filter(Boolean))];
      const used = new Set(parts.filter((p) => links.has(p)));
      // A mode with no ribbon (retro) marks the head row with its glyph, as the band does.
      // A folded tile leads with the mode's glyph, as a mode with no ribbon does.
      const glyph = mode && (!mode.band || folded) ? (mode.glyph || "") : "";
      // On the slab the opening rows' labels share the project's column (STATUS-09), unless
      // the project is so much wider that the column would part a label from its note.
      const labels = [reviewLabel, modeBand && !folded ? modeLabel : ""].filter(Boolean).map(cells);
      const labelW = labels.length ? Math.max(...labels) : 0;
      const aligned = labelW && Math.abs(cells(parts[0] || "") - labelW) <= LEAD_SLACK;
      const lead = aligned ? Math.max(labelW, cells(parts[0] || "")) : 0;
      for (const r of [reviewrow, moderow]) r.querySelector(".rb-mode").style.minWidth = (lead || labelW) + "ch";
      // Folded, the note (why it's parked) follows the project; the branch drops, the task trails.
      const shown = folded ? parts.filter((p) => p !== branch) : parts;
      const note = folded ? moderow.querySelector(".rb-note").innerHTML : "";
      const head = shown.map((p, i) => {
        if (i === 0) return '<span class="lead"' + (lead ? ' style="min-width:' + lead + 'ch"' : "") + ">" + escapeHtml(p) + "</span>";
        if (p === branch && panel) {
          const text = '<span style="color:' + (BRANCH_HUE[panel.branch_slot] || "inherit") + '">'
            + escapeHtml(panel.branch_sync ? panel.branch_sync + " " + p : p) + "</span>";
          const href = links.get(p) || panel.branch_url;
          return '<span class="br">' + (href ? linkHtml(href, text) : text) + "</span>";
        }
        return '<span class="task">' + (links.has(p) ? linkHtml(links.get(p), escapeHtml(p)) : escapeHtml(p)) + "</span>";
      });
      if (note) head.splice(1, 0, '<span class="note">' + note + "</span>");
      setHtml(row.querySelector(".pip-proj"), (glyph ? "<span>" + escapeHtml(glyph) + "</span>" : "") + head.join(""));

      const web = row.querySelector(".pip-btn.web"), code = row.querySelector(".pip-btn.code");
      const canOpen = !!(panel && panel.anchor_cwd);
      web.hidden = !(canOpen && panel.forge);
      code.hidden = !canOpen;
      if (canOpen) {
        if (panel.forge) web.textContent = "↖ " + panel.forge;
        code.textContent = panel.code_label + " ↗";
        code.dataset.tip = "Open its directory in " + panel.code_label;
      }

      setHtml(row.querySelector(".pip-lines"), lines
        .map((segs) => segs.filter((g) => !("href" in g && used.has(g.label))))
        .filter((segs) => segs.some((g) => "href" in g || g.text.replace(/[\s·]/g, "") !== ""))
        .map((segs) => "<div>" + segs.map(segHtml).join("") + "</div>").join(""));

      // The turn is Markdown (WIP-20): escaped first, then formatted, so a link
      // shows as its label and opens on a click.
      const turn = s.latest_turn && s.latest_turn.text;
      setHtml(row.querySelector(".pip-turn"), turn
        ? '<span class="role">' + (s.latest_turn.role === "human" ? "›" : "↳") + "</span>" + renderInline(turn)
        : "");

      const age = row.querySelector(".pip-age");
      const a = pipAge(s.age_seconds);
      if (age.textContent !== a) age.textContent = a;
    }

    function resizePip() {
      if (!pip.win || !pip.root) return;
      // Auto-fit height to content (the "minimum size" ask), capped so a long
      // queue scrolls rather than filling the display; width stays whatever the
      // user last dragged it to.
      const h = Math.min(Math.ceil(pip.root.scrollHeight) + 8, 680);
      try { pip.win.resizeTo(pip.win.outerWidth || 560, Math.max(120, h)); } catch (_) {}
    }

    let scheduled = false, latest = null;
    function schedule(payload) {
      latest = payload;
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => { scheduled = false; render(latest); });
    }

    let inFlight = false;
    async function poll() {
      if (inFlight) return;
      inFlight = true;
      try {
        const r = await fetch("/wip.json", { cache: "no-store" });
        const payload = await r.json();
        schedule(payload);
        const ts = payload.generated_at ? new Date(payload.generated_at) : new Date();
        document.getElementById("freshness").innerHTML =
          'updated <span class="live">' + ts.toLocaleTimeString() + "</span>";
      } catch (e) {
        document.getElementById("freshness").innerHTML =
          '<span class="stale">⚠ serve unreachable — is `beacon serve` running?</span>';
      } finally { inFlight = false; }
    }

    // The tab stack button only appears where Document Picture-in-Picture exists —
    // no dead button that errors on click in unsupported browsers.
    const tabStackBtn = document.getElementById("tabstack");
    if (pipSupported) {
      tabStackBtn.hidden = false;
      setTabStackActive(false);
      tabStackBtn.addEventListener("click", toggleTabStack);
      // A tab stack can't outlive its opener: closing or reloading this tab tears
      // the floating panel down with it. Guard that with the browser's native
      // leave-confirmation while a tab stack is live, so a stray close doesn't
      // silently drop the always-on-top action queue.
      window.addEventListener("beforeunload", (e) => {
        if (pip.win) { e.preventDefault(); e.returnValue = ""; }
      });
    }

    document.getElementById("order").addEventListener("click", onOrderClick);
    paintOrder();

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
