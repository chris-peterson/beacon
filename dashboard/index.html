<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beacon · fleet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='5' fill='%23bd93f9'/%3E%3C/svg%3E">

  <!--
    Reference fleet dashboard. Self-contained (no build, no dependencies, no
    network fonts) so any coworker can run `beacon serve` and open it — beacon
    serves this file at / and the data at /wip.json. It is a *reference*: clone
    and restyle it, or point your own dashboard at the same /wip.json + /focus +
    /forget contract (docs/spec.md, WIP-04 / FOCUS / FORGET). Cross-platform —
    the fleet view needs no iTerm2 or macOS; only click-to-focus is iTerm2-only,
    and cards that can't be focused say so.

    Design POV — a signal-tower console. Visual noise is proportional to how
    much a session needs you: sessions blocked on you (or flagged for attention)
    are pulled into a loud, glowing top band; the idle fleet recedes into quiet
    flat tiles below. A session's /color (agent_color) is honored as a first-
    class identity pill, mirroring Claude Code's own session frame.
  -->
  <style>
    :root {
      /* Status hexes MIRROR BADGE_COLOR_PALETTE in scripts/beacon so a card's
         dot matches the same session's iTerm2 badge — do not drift these.
         SDLC cycles: dev (ready/busy/blocked) + the mode cycles. Green is
         retired from the dev stoplight (ready is gray) and pins `release`. */
      --ready:    #8b8fa0;
      --busy:     #ffb86c;
      --blocked:  #ff5555;
      --paused:   #6272a4;
      --release:  #50fa7b;
      --retro:    #f8f8f2;
      --done:     #5f6072;

      /* Console chrome — free to tune; not part of the badge contract. */
      --bg:       #0d0e15;
      --bg-2:     #10111a;
      --panel:    #171925;
      --panel-hi: #1e2130;
      --line:     #2a2e40;
      --line-hi:  #39405a;
      --fg:       #e8e8f4;
      --muted:    #808ab4;
      --faint:    #565f80;
      --accent:   #bd93f9;
      --cyan:     #8be9fd;

      --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "Fira Code", Menlo, Consolas, monospace;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.01em;
      background-color: var(--bg);
      /* Atmosphere: a beacon glow raking down from the top, a whisper of grid
         texture, and a floor vignette — all low-opacity so the tiles read. */
      background-image:
        radial-gradient(120% 60% at 50% -8%, rgba(189, 147, 249, 0.14), transparent 60%),
        radial-gradient(90% 50% at 50% -4%, rgba(139, 233, 253, 0.06), transparent 55%),
        linear-gradient(var(--bg-2) 1px, transparent 1px),
        linear-gradient(90deg, var(--bg-2) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
      background-position: 0 0, 0 0, -1px -1px, -1px -1px;
      background-attachment: fixed;
      padding: 0 clamp(1rem, 3vw, 2.5rem) 3rem;
    }

    /* ── Masthead ─────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      flex-wrap: wrap;
      padding: 1.15rem 0 1rem;
      margin-bottom: 1.4rem;
      background: linear-gradient(var(--bg) 62%, rgba(13, 14, 21, 0));
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: baseline; gap: 0.6rem; }
    .beacon-glyph {
      position: relative;
      width: 1.05rem; height: 1.05rem;
      align-self: center;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(189, 147, 249, 0.55);
      animation: beaconPulse 2.6s ease-out infinite;
    }
    @keyframes beaconPulse {
      0%   { box-shadow: 0 0 0 0 rgba(189, 147, 249, 0.5), 0 0 10px 1px rgba(189, 147, 249, 0.6); }
      70%  { box-shadow: 0 0 0 12px rgba(189, 147, 249, 0), 0 0 10px 1px rgba(189, 147, 249, 0.6); }
      100% { box-shadow: 0 0 0 0 rgba(189, 147, 249, 0), 0 0 10px 1px rgba(189, 147, 249, 0.6); }
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 .dim { color: var(--faint); font-weight: 400; }

    .spacer { flex: 1 1 auto; }

    .freshness { color: var(--faint); font-size: 0.76rem; white-space: nowrap; }
    .freshness .live { color: var(--release); } /* green = live/good (ready is now a neutral gray) */
    .freshness .live::before {
      content: "●"; margin-right: 0.3rem; font-size: 0.7em;
      animation: blink 2s steps(1) infinite;
    }
    .freshness .stale { color: var(--busy); }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* ── Needs-you band: waiting / flagged sessions are hoisted out of the fleet
       into a pinned top band (WIP-10 — "a prominent band above the calmer
       fleet"), so a blocked session is never buried in a group or a z-stack. */
    #attn { margin-bottom: 1.6rem; }
    #attn[hidden] { display: none; }
    .attn-head {
      display: flex; align-items: center; gap: 0.55rem;
      margin: 0 0 0.6rem; padding-left: 0.15rem;
      font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--blocked);
    }
    .attn-head::before {
      content: ""; width: 0.5rem; height: 0.5rem; border-radius: 50%;
      background: var(--blocked); box-shadow: 0 0 8px var(--blocked);
      animation: blink 1.2s steps(1) infinite;
    }
    .attn-head .grule { flex: 1; height: 1px; background: rgba(255, 85, 85, 0.28); }

    /* per-group sub-sections. */
    .group-section { margin-bottom: 1.15rem; }
    .group-section:last-child { margin-bottom: 0; }
    .group-head {
      display: flex; align-items: baseline; gap: 0.5rem;
      margin: 0 0 0.55rem; padding-left: 0.15rem;
      font-size: 0.75rem; color: var(--muted);
    }
    .group-head[hidden] { display: none; }
    .group-head .glabel {
      font-weight: 700; letter-spacing: 0.04em; color: var(--fg);
      text-transform: none;
    }
    .group-head .gn { color: var(--faint); font-variant-numeric: tabular-nums; }
    .group-head .grule { flex: 1; height: 1px; background: var(--line); }

    .grid {
      display: grid;
      --gap: 0.85rem;
      gap: var(--gap);
      align-items: start; /* an expanded card grows alone — don't stretch its row */
      /* Responsive auto-fill, capped at 4 across: each column is at least a
         quarter of the row (minus the 3 inter-column gaps), so a wide screen
         never packs a 5th; below that the 19rem floor takes over. */
      grid-template-columns: repeat(auto-fill, minmax(max(19rem, (100% - 3 * var(--gap)) / 4), 1fr));
    }

    /* ── Project z-stack: same-project sessions overlap, newest in front ──
       A lone session is a plain card (no .stacked, no chrome). Multiple sessions
       share one grid cell so the stack sizes to the front card; the peeking ones
       recede down-and-right by --depth. Reserved padding keeps the peek inside
       the cell so it never overruns the neighbouring column. */
    .stack { position: relative; }
    .stack.stacked {
      display: grid;
      padding: 0 1.9rem 1.9rem 0;
    }
    .stack.stacked > .card {
      grid-area: 1 / 1;
      z-index: calc(5 - var(--depth)); /* front on top; each peeks past the one below */
      /* Animate the raise: --depth and .front flip on raiseStack, so translate /
         scale / filter slide the cards into their new positions rather than
         snapping. (transform stays out of it — the cardIn entrance owns that.) */
      transition: translate 0.26s cubic-bezier(0.2, 0.7, 0.3, 1),
                  scale 0.26s cubic-bezier(0.2, 0.7, 0.3, 1),
                  filter 0.22s ease, box-shadow 0.22s ease;
    }
    .stack.stacked > .card.front {
      translate: 0 0; scale: 1; /* explicit endpoints so the raise animates cleanly */
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); /* lift the front off the pile */
    }
    /* Offset via the independent `translate`/`scale` properties, NOT the
       `transform` shorthand: the base card's `cardIn` entrance animates
       `transform` with fill-mode:both, whose final `transform:none` would
       otherwise override a shorthand offset here and flatten the pile. */
    .stack.stacked > .card:not(.front) {
      translate: calc(var(--depth) * 0.9rem) calc(var(--depth) * 0.85rem);
      scale: 0.98;
      filter: brightness(0.8) saturate(0.9);
    }
    .stack.stacked > .card:not(.front):hover {
      translate: calc(var(--depth) * 1.1rem) calc(var(--depth) * 1.05rem);
      scale: 1;
      filter: none;
    }
    /* Hover preview for a peeking card — one shared fixed element, positioned in
       JS under the hovered card (showStackTip). It lives on <body>, outside the
       card's overflow:hidden, so unlike a ::before it isn't clipped. */
    #stack-tip {
      position: fixed; z-index: 200; max-width: 22rem;
      background: var(--panel-hi); border: 1px solid var(--line-hi);
      border-radius: 8px; padding: 0.4rem 0.65rem;
      font-size: 0.72rem; line-height: 1.4; color: var(--fg);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      pointer-events: none; white-space: normal;
      animation: fcIn 0.12s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    #stack-tip[hidden] { display: none; }
    /* ── Card (shared shell; .needs-you adds the waiting emphasis) ─ */
    .card {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      --pad-x: 0.95rem; --pad-top: 0.85rem;
      padding: var(--pad-top) var(--pad-x) 0.8rem;
      overflow: hidden;
      isolation: isolate; /* contain the mode watermark ::before (z-index -1) above the tint, below content */
      transition: border-color 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
      animation: cardIn 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    /* Status accent — a bar along the BOTTOM edge, where the eye rests during a
       session. Carries the logical state color (ready/busy/blocked + mode
       states); the full-width title band owns the top, so identity and status
       never compete for the same hairline. Active states glow to pull focus. */
    .card::after {
      content: "";
      position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: var(--state-color, var(--line-hi));
      opacity: 0.85;
    }
    .card.state-busy::after,
    .card.state-blocked::after,
    .card.state-retro::after,
    .card.state-release::after { opacity: 1; box-shadow: 0 0 10px var(--state-color); }
    .card.state-ready   { --state-color: var(--ready); }
    .card.state-busy    { --state-color: var(--busy); }
    .card.state-blocked { --state-color: var(--blocked); }
    .card.state-paused  { --state-color: var(--paused); }
    .card.state-release { --state-color: var(--release); }
    .card.state-retro   { --state-color: var(--retro); }
    .card.state-done    { --state-color: var(--done); }

    /* Mode-state cards echo their iTerm2 pane background (RENDER-05): a muted tint
       in the mode's hue plus a large, faint, centered watermark. The watermark is
       the *same generated asset the pane paints* (iterm/<phase>-bg.png), streamed
       by serve at /mode-bg/<state> — so the card and pane can never drift. It
       rides a ::before below the card content (z-index -1; the card isolates a
       stacking context) at a low opacity, the fleet analog of the pane's Blend. */
    .card.state-paused  { background-color: color-mix(in srgb, #3c3357 26%, var(--panel)); }
    .card.state-release { background-color: color-mix(in srgb, #212c45 34%, var(--panel)); }
    .card.state-retro   { background-color: color-mix(in srgb, #2c4636 20%, var(--panel)); }
    .card.state-done    { background-color: color-mix(in srgb, var(--bg) 55%, var(--panel)); }

    .card.state-paused::before,
    .card.state-release::before,
    .card.state-retro::before,
    .card.state-done::before {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background-repeat: no-repeat; background-position: center; background-size: 62% auto;
      opacity: 0.16; pointer-events: none;
    }
    .card.state-paused::before  { background-image: url("/mode-bg/paused"); }
    .card.state-release::before { background-image: url("/mode-bg/release"); }
    .card.state-retro::before   { background-image: url("/mode-bg/retro"); }
    .card.state-done::before    { background-image: url("/mode-bg/done"); }

    .card { cursor: pointer; } /* the whole body toggles expand; go/forget stop propagation */
    .card:hover {
      border-color: var(--line-hi);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    /* Header row: status dot + project (or /color pill) + task */
    .head { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .dot {
      width: 0.62rem; height: 0.62rem; border-radius: 50%;
      flex: none; background: var(--state-color, var(--muted));
    }
    .state-busy    .dot,
    .state-blocked .dot,
    .state-retro   .dot,
    .state-release .dot { box-shadow: 0 0 7px var(--state-color); }
    /* Project icon (PROV-08) stands in for the dot when the project ships one;
       the top bar still carries the status color. */
    .icon {
      width: 1.05rem; height: 1.05rem; border-radius: 4px;
      flex: none; object-fit: cover;
    }
    .icon[hidden], .dot[hidden] { display: none; }

    .label {
      flex: 0 1 auto; min-width: 0;
      display: inline-flex; align-items: baseline; gap: 0.4rem;
    }
    .project {
      font-weight: 700; letter-spacing: 0.02em;
      /* The project is the identity — it holds its width (up to a cap); the
         (secondary) task truncates first. */
      flex: 0 0 auto; min-width: 0; max-width: 24ch;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task {
      color: var(--cyan);
      flex: 0 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task::before { content: "· "; color: var(--faint); }
    /* The session's /color (agent_color) reads as a compact identity pill around
       the project name (README: a "first-class identity pill") — it marks whose
       session this is without a full color band shouting over the status colors,
       which stay on the dot + bottom bar. */
    .card.has-color .project {
      background: var(--agent-color); color: var(--agent-fg);
      padding: 0.05rem 0.5rem; border-radius: 999px;
    }

    /* Latest turn (WIP-11): collapsed = one scannable, width-ellipsized line;
       expanded = the full turn, wrapped. The whole point of expand. */
    .turn {
      margin: 0.5rem 0 0;
      color: var(--muted); font-size: 0.82rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .turn .tglyph { margin-right: 0.3rem; opacity: 0.9; }
    .turn[data-role="human"] .tglyph { color: var(--cyan); }
    .turn[data-role="agent"] .tglyph { color: var(--accent); }
    /* Expanded: the full turn (WIP-14), fetched on demand from /turn/<hash> and
       rendered as lightweight markdown (bold, inline + fenced code, lists,
       headings) — the shape Claude's replies actually arrive in. renderMarkdown()
       escapes before it formats, so no turn text can inject markup. The block
       reads as a quoted transcript panel and the glyph grows into a role label. */
    .card.expanded .turn {
      display: block;
      white-space: normal; /* undo the collapsed one-liner's nowrap so prose wraps */
      overflow: visible; text-overflow: clip; overflow-wrap: anywhere;
      margin-top: 0.6rem;
      padding: 0.5rem 0.7rem 0.6rem;
      border: 1px solid var(--line);
      /* Left accent encodes WHO spoke (role), not status — status already owns
         the bottom bar + dot, so the two never double-encode the same signal. */
      border-left: 2px solid var(--turn-accent, var(--line-hi));
      border-radius: 8px;
      background: var(--bg-2);
      color: var(--fg); opacity: 1;
      font-size: 0.8rem; line-height: 1.55;
    }
    .card.expanded .turn .tglyph {
      display: block; margin: 0 0 0.4rem;
      font-size: 0.63rem; letter-spacing: 0.16em; text-transform: uppercase;
      opacity: 0.75;
    }
    .card.expanded .turn[data-role="human"] { --turn-accent: var(--cyan); }
    .card.expanded .turn[data-role="agent"] { --turn-accent: var(--accent); }
    .card.expanded .turn[data-role="human"] .tglyph::after { content: " you"; }
    .card.expanded .turn[data-role="agent"] .tglyph::after { content: " claude"; }
    .card.expanded .ttext { display: block; }

    /* Rendered-markdown primitives, scoped to .ttext so they never touch the
       collapsed one-liner (which stays plain textContent). */
    .ttext > :first-child { margin-top: 0; }
    .ttext > :last-child { margin-bottom: 0; }
    .ttext .md-p { margin: 0.5rem 0; }
    .ttext .md-h { margin: 0.75rem 0 0.35rem; font-weight: 700; color: var(--fg); }
    .ttext .md-h1 { font-size: 1rem; letter-spacing: 0.01em; }
    .ttext .md-h2 { font-size: 0.92rem; }
    .ttext .md-h3, .ttext .md-h4, .ttext .md-h5, .ttext .md-h6 {
      font-size: 0.84rem; color: var(--muted); letter-spacing: 0.02em;
    }
    .ttext strong { color: #fff; font-weight: 700; }
    .ttext em { font-style: italic; }
    /* Rendered markdown links (turn + description). */
    .ttext a, .desc a {
      color: var(--cyan); text-decoration: underline; text-underline-offset: 2px;
      text-decoration-color: rgba(139, 233, 253, 0.5);
    }
    .ttext a:hover, .desc a:hover { color: var(--fg); text-decoration-color: currentColor; }
    .ttext .md-ul, .ttext .md-ol { margin: 0.45rem 0; padding-left: 1.3rem; }
    .ttext .md-ul { list-style: none; }
    .ttext .md-ul > li { position: relative; }
    .ttext .md-ul > li::before {
      content: "▸"; position: absolute; left: -1.05rem;
      color: var(--accent); opacity: 0.8;
    }
    .ttext .md-ol { list-style: decimal; }
    .ttext .md-ol > li::marker { color: var(--faint); }
    .ttext li { margin: 0.18rem 0; }
    .ttext code {
      font-family: var(--mono); font-size: 0.92em;
      background: var(--panel-hi); color: var(--cyan);
      border: 1px solid var(--line); border-radius: 4px;
      padding: 0.02em 0.34em;
    }
    .ttext .md-pre {
      margin: 0.5rem 0; padding: 0.55rem 0.65rem;
      background: #0a0b12; border: 1px solid var(--line);
      border-radius: 6px; overflow-x: auto;
    }
    .ttext .md-pre code {
      background: none; border: none; padding: 0; color: var(--fg);
      font-size: 0.82rem; line-height: 1.5; white-space: pre;
    }
    /* Tables scroll horizontally inside their own wrapper — the card never
       widens to fit a wide table (matches the code-block treatment). */
    .ttext .md-tw { margin: 0.5rem 0; overflow-x: auto; }
    .ttext .md-table { border-collapse: collapse; font-size: 0.78rem; }
    .ttext .md-table th, .ttext .md-table td {
      border: 1px solid var(--line); padding: 0.28rem 0.55rem; white-space: nowrap;
    }
    .ttext .md-table th {
      background: var(--panel-hi); color: var(--fg); font-weight: 700; letter-spacing: 0.02em;
    }
    .ttext .md-table tbody tr:nth-child(even) td { background: rgba(255, 255, 255, 0.025); }

    /* Recall note / pause reason */
    .desc {
      color: var(--fg); opacity: 0.7;
      margin: 0.45rem 0 0; font-size: 0.82rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card.expanded .desc { display: block; overflow: visible; }

    /* Expanding un-truncates the project · task so the full text shows (the
       `…` was the cue that there's more) — wrapped within the card's normal
       width, not by widening the card. */
    .card.expanded .project { max-width: none; }
    .card.expanded .task { white-space: normal; overflow: visible; }

    /* Bound-tack references (WIP-09): the change requests / issues / other the
       session is driving — the signal tack alone contributes. Ordered and
       colored by emphasis: change request (accent) → issue (cyan) → other. */
    .tacks { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0 0; }
    .tref {
      display: inline-flex; align-items: center; gap: 0.25rem;
      max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.72rem; line-height: 1.3;
      padding: 0.08rem 0.45rem; border-radius: 999px;
      border: 1px solid var(--line-hi); color: var(--muted);
      text-decoration: none;
    }
    .tref .tg { opacity: 0.85; }
    a.tref { transition: background 0.15s, border-color 0.15s, color 0.15s; }
    a.tref:hover { color: var(--fg); }
    .tref.cr { color: var(--accent); border-color: rgba(189, 147, 249, 0.45); font-weight: 700; }
    a.tref.cr:hover { background: rgba(189, 147, 249, 0.14); border-color: var(--accent); }
    .tref.issue { color: var(--cyan); border-color: rgba(139, 233, 253, 0.35); }
    a.tref.issue:hover { background: rgba(139, 233, 253, 0.12); border-color: var(--cyan); }
    .tref.other { color: var(--muted); }
    a.tref.other:hover { border-color: var(--line-hi); background: var(--panel-hi); }

    /* Expand-only detail block: the fields too verbose for the resting card. */
    .details {
      margin: 0.6rem 0 0; padding-top: 0.55rem;
      border-top: 1px dashed var(--line);
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .card.expanded .details { display: block; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .details .kv { display: flex; align-items: start; gap: 0.7rem; font-size: 0.75rem; margin: 0.2rem 0; }
    .details dt { color: var(--faint); flex: none; width: 4.5rem; text-align: right; }
    .details dd { color: var(--muted); margin: 0; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .details dd.sess { color: var(--faint); font-size: 0.72rem; }
    .copy {
      flex: none; margin-left: auto;
      width: 1.2rem; height: 1.2rem; padding: 0;
      display: inline-grid; place-items: center;
      background: none; border: 1px solid var(--line); border-radius: 4px;
      color: var(--faint); cursor: pointer; font-size: 0.72rem; line-height: 1;
      transition: color 0.15s, border-color 0.15s;
    }
    .copy::before { content: "⧉"; }
    .copy:hover { color: var(--fg); border-color: var(--line-hi); }
    .copy.copied { color: var(--release); border-color: var(--release); } /* green = success */
    .copy.copied::before { content: "✓"; }

    /* Footer: meta on the left, expand chevron, dedicated go button lower-right. */
    .foot {
      display: flex; align-items: center; gap: 0.5rem;
      margin-top: 0.65rem;
    }
    .chev {
      flex: none; color: var(--faint); font-size: 0.9rem; line-height: 1;
      user-select: none; transition: transform 0.18s ease, color 0.15s;
    }
    .card:hover .chev { color: var(--muted); }
    .card.expanded .chev { transform: rotate(180deg); color: var(--muted); }
    .sub {
      flex: 1 1 auto; min-width: 0;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.85rem;
      color: var(--faint); font-size: 0.75rem;
    }
    .sub > span:empty { display: none; }
    .sub .route { color: var(--accent); }
    .sub .age { font-variant-numeric: tabular-nums; }
    .sub .age::before { content: "◷ "; opacity: 0.7; }
    .go {
      flex: none;
      display: inline-flex; align-items: center; gap: 0.32rem;
      background: transparent; color: var(--muted);
      border: 1px solid var(--line-hi); border-radius: 6px;
      font: inherit; font-size: 0.74rem; letter-spacing: 0.05em;
      padding: 0.22rem 0.6rem; cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .go .arr { transition: transform 0.15s ease; }
    .go:hover { color: #14151c; background: var(--accent); border-color: var(--accent); }
    .go:hover .arr { transform: translateX(3px); }
    .go[hidden] { display: none; }

    .forget {
      position: absolute; top: 0.35rem; right: 0.4rem; z-index: 3;
      width: 1.35rem; height: 1.35rem;
      display: grid; place-items: center;
      background: none; border: none; color: var(--faint);
      font-size: 1.05rem; line-height: 1; cursor: pointer;
      border-radius: 6px; opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .card:hover .forget { opacity: 1; }
    /* Only the front/top card exposes its controls — a behind card is
       click-anywhere-to-raise, so its close (×) and go buttons are hidden (a
       behind card's confirm fly-out would open buried under the front anyway). */
    .card:not(.front) .forget,
    .card:not(.front) .go { display: none; }
    .forget:hover { color: #fff; background: var(--blocked); }
    .card.confirming .forget { opacity: 0; pointer-events: none; }

    /* Inline forget confirmation — a localized fly-out at the card corner that
       replaces the browser confirm() dialog. Dismisses on Keep / Esc / click-away. */
    .forget-confirm {
      position: absolute; top: 0.3rem; right: 0.35rem; z-index: 6;
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.25rem 0.3rem 0.25rem 0.6rem;
      background: var(--panel-hi); border: 1px solid var(--line-hi);
      border-radius: 8px; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      font-size: 0.72rem; white-space: nowrap;
      transform-origin: top right;
      animation: fcIn 0.13s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }
    .forget-confirm[hidden] { display: none; }
    @keyframes fcIn {
      from { opacity: 0; transform: scale(0.92) translateY(-3px); }
      to   { opacity: 1; transform: none; }
    }
    .forget-confirm .fc-label { color: var(--muted); }
    .forget-confirm button {
      font: inherit; font-size: 0.7rem; border: none; border-radius: 5px;
      padding: 0.2rem 0.5rem; cursor: pointer; transition: background 0.12s, color 0.12s, filter 0.12s;
    }
    .forget-confirm .fc-yes { background: var(--blocked); color: #1a0606; font-weight: 700; }
    .forget-confirm .fc-yes:hover { filter: brightness(1.12); }
    .forget-confirm .fc-no { background: none; color: var(--muted); }
    .forget-confirm .fc-no:hover { color: var(--fg); background: var(--line); }

    /* Waiting-for-you ornaments — hidden by default, shown on .needs-you cards. */
    .attn-flag { display: none; }
    .wait-time:empty { display: none; } /* no trailing gap in the badge when age is unknown */

    /* ── Needs-you emphasis (per card, anywhere in the grouped view) ──
       A session blocked on the user (or flagged for attention) keeps this
       treatment wherever it sorts — sorted first within its group, and its
       group floats up — so it stays unmissable without a dedicated band. */
    .card.needs-you {
      background:
        radial-gradient(120% 140% at 100% 0%, rgba(255, 85, 85, 0.12), transparent 55%),
        var(--panel-hi);
      border-color: rgba(255, 85, 85, 0.5);
      --pad-x: 1.1rem; --pad-top: 1rem;
      padding: var(--pad-top) var(--pad-x) 0.9rem;
      box-shadow: 0 0 0 1px rgba(255, 85, 85, 0.14), 0 8px 30px rgba(0, 0, 0, 0.4);
      animation: cardIn 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both, attnGlow 2.4s ease-in-out infinite;
    }
    @keyframes attnGlow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255, 85, 85, 0.14), 0 8px 30px rgba(0, 0, 0, 0.4); }
      50%      { box-shadow: 0 0 0 1px rgba(255, 85, 85, 0.4),  0 8px 34px rgba(255, 85, 85, 0.15); }
    }
    .card.needs-you::after { height: 4px; opacity: 1; }
    .card.needs-you:hover {
      border-color: var(--blocked);
      box-shadow: 0 0 0 1px var(--blocked), 0 14px 40px rgba(255, 85, 85, 0.22);
    }
    .card.needs-you .go:hover { color: #1a0606; background: var(--blocked); border-color: var(--blocked); }
    .card.needs-you .project { font-size: 1.08rem; }
    .card.needs-you .head { gap: 0.55rem; }
    .card.needs-you .dot { width: 0.72rem; height: 0.72rem; }
    .card.needs-you .turn { font-size: 0.85rem; margin-top: 0.6rem; }

    /* The badge sits on its OWN row above the title (not inside the head flex
       row) so it never steals width from project · task — a short task stays on
       one line; the badge just pushes the title down. */
    .card.needs-you .attn-flag {
      display: inline-flex; align-items: center; gap: 0.4rem;
      margin: 0 0 0.55rem;
      padding: 0.16rem 0.55rem;
      border-radius: 999px;
      background: var(--blocked);
      color: #1a0606;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .card.needs-you .attn-flag::before {
      content: ""; width: 0.4rem; height: 0.4rem; border-radius: 50%;
      background: #1a0606; animation: blink 1.2s steps(1) infinite;
    }
    /* pending_attention that is *not* a live block reads amber, not red. */
    .card.needs-you.soft-attn {
      border-color: rgba(255, 184, 108, 0.5);
      animation: cardIn 0.32s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      box-shadow: 0 0 0 1px rgba(255, 184, 108, 0.14), 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .card.needs-you.soft-attn .attn-flag { background: var(--busy); color: #241503; }
    .card.needs-you.soft-attn .attn-flag::before { background: #241503; }
    .card.needs-you.soft-attn::after { background: var(--busy); }

    /* The waiting duration rides inside the badge (e.g. "● WAITING · 5m"); the
       flex gap separates it from the label. text-transform:none keeps "5m"
       lowercase against the uppercased label; it inherits the badge's text color. */
    .attn-flag .wait-time {
      text-transform: none; font-weight: 700;
      font-variant-numeric: tabular-nums; opacity: 0.9;
    }
    .attn-flag .wait-time::before { content: "· "; opacity: 0.55; }
    /* The pill doubles as a focus trigger on focusable cards (== the go button);
       give it the affordance only there, so a non-focusable pill stays a label. */
    .card[data-focusable="true"] .attn-flag { cursor: pointer; }
    .card[data-focusable="true"] .attn-flag:hover { filter: brightness(1.12); }
    /* the badge already states the duration up top — don't repeat age below. */
    .card.needs-you .sub .age { display: none; }

    /* ── Empty & error ────────────────────────────────────────── */
    #empty {
      color: var(--faint); padding: 4rem 1rem; text-align: center;
      border: 1px dashed var(--line); border-radius: var(--radius);
    }
    #empty .big { display: block; font-size: 1.6rem; margin-bottom: 0.6rem; opacity: 0.6; }
    #err {
      display: none; color: #ffb3b3;
      background: rgba(255, 85, 85, 0.1); border: 1px solid rgba(255, 85, 85, 0.4);
      border-radius: 8px; padding: 0.5rem 0.75rem;
      font-size: 0.8rem; margin-bottom: 0.9rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="beacon-glyph" aria-hidden="true"></span>
      <h1>beacon <span class="dim">/ fleet</span></h1>
    </div>
    <span class="spacer"></span>
    <span class="freshness" id="freshness"></span>
  </header>

  <div id="err"></div>

  <div id="attn" hidden>
    <div class="attn-head">needs you<span class="grule"></span></div>
    <div class="grid attn-grid"></div>
  </div>

  <div id="groups"></div>

  <div id="empty" hidden>
    <span class="big">◍</span>
    No active beacon sessions in the window.<br>
    Sessions appear here as Claude Code works.
  </div>

  <script>
    const POLL_MS = 2000;
    const groupsEl = document.getElementById("groups");
    const attnEl = document.getElementById("attn");
    const cards = new Map(); // hash -> card element (reused across polls)
    const groupSections = new Map(); // group key -> {section, grid, head} (reused)

    // Grouping has no toggle: the fleet always groups by the route group signal
    // when a session carries one, and sessions with none degrade silently into an
    // unlabeled section at the bottom (computeGroups). Same-project sessions
    // within a group collapse into a z-stack (placeStack).

    // project -> hash the user pulled to the front of its z-stack. Persists
    // across polls so a manual raise survives re-renders (buffer-dom-rerenders);
    // stale entries (raised session gone) are dropped in placeStack.
    const raised = new Map();
    // hash -> {at, text}: the full turn (WIP-14) fetched on expand from
    // /turn/<hash>, keyed by turn timestamp so a newer turn invalidates it.
    const turnCache = new Map();

    const STATES = ["ready", "busy", "blocked", "paused", "release", "retro", "done"];

    // Resolve a CSS color name to {css, fg, ok}. fg is a contrast-picked text
    // color for the /color pill. A hidden probe lets the browser do the parsing;
    // an unrecognized name resolves to the inherited fg, which we treat as ok
    // (the payload's agent_color comes from Claude Code's /color, always valid).
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none";
    document.body.appendChild(probe);
    const colorCache = new Map();
    function resolveColor(name) {
      if (colorCache.has(name)) return colorCache.get(name);
      probe.style.color = "";
      probe.style.color = name;
      const rgb = getComputedStyle(probe).color.match(/\d+(\.\d+)?/g);
      let out = { css: name, fg: "#fff" };
      if (rgb) {
        const [r, g, b] = rgb.map(Number);
        const L = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        out.fg = L > 0.62 ? "#141018" : "#fff";
      }
      colorCache.set(name, out);
      return out;
    }

    function fmtAge(s) {
      if (s == null) return "";
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s / 60) + "m";
      if (s < 86400) return Math.floor(s / 3600) + "h";
      return Math.floor(s / 86400) + "d";
    }

    // A session lands in the attention band when Claude is blocked on the user
    // (state === "blocked", i.e. status "waiting") or a sticky attention marker
    // is set (HOOK-03b). The band is the loud one — everything else is fleet.
    // A session in a mode state (paused / release / retro / done) is never
    // "needs you": the mode is a deliberate user/session declaration that
    // outranks a lingering pending-attention marker, exactly as the pane's
    // logical state does (mode > pending_attention). So a parked or shipping
    // session keeps its mode-card treatment in the fleet instead of being
    // hoisted into the band (whose red glow would paint over that treatment).
    const MODE_STATES = new Set(["paused", "release", "retro", "done"]);
    function needsYou(s) {
      if (MODE_STATES.has(s.state)) return false;
      return s.state === "blocked" || !!s.pending_attention;
    }

    // Lightweight markdown for the expanded turn (WIP-14). Claude's replies are
    // lightly formatted — bold, inline/fenced code, bulleted or numbered lists,
    // the occasional heading — and the stored full text keeps those markers
    // (unlike the flattened excerpt). We render exactly that subset. Everything
    // is HTML-escaped before any formatting runs, so turn text can never inject
    // markup; unrecognized syntax falls through as plain (escaped) text.
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }

    // Inline formatting for one line of text. Code spans are pulled to
    // placeholders FIRST so their contents are never re-formatted — and so bold
    // can wrap a code span (**`x`** renders as bold code, which splitting on
    // backticks couldn't do). Everything else is escaped, then links / bold /
    // italic run, then the code spans are restored (escaped). Links accept only
    // http(s) / relative / anchor hrefs and quote-escape the URL, so a
    // javascript:/data: URL or an attribute-breakout falls through as plain
    // text. Bold (**) is matched before italic (*), both requiring non-space
    // edges so a stray marker is left alone. Underscore emphasis is opt-in
    // (underscoreEm) and word-boundaried: off for turns (so snake_case isn't
    // mangled), on for the description (beacon's status overlay emits _x_).
    function renderInline(s, underscoreEm) {
      const codes = [];
      s = s.replace(/`([^`]+)`/g, (_, c) => "\x00" + (codes.push(c) - 1) + "\x00");
      let out = escapeHtml(s)
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
          if (!/^(https?:\/\/|\/|#)/i.test(url.replace(/&amp;/g, "&"))) return m;
          return '<a href="' + url.replace(/"/g, "&quot;") + '" target="_blank" rel="noopener">' + text + "</a>";
        })
        .replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(\S(?:.*?\S)?)\*/g, "<em>$1</em>");
      if (underscoreEm) {
        // Only when a leading boundary (start/space/paren) and a trailing one
        // (space/punct/end) bracket the pair — so a path or snake_case token in
        // a recall note keeps its underscores.
        out = out.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
      }
      return out.replace(/\x00(\d+)\x00/g, (_, i) => "<code>" + escapeHtml(codes[+i]) + "</code>");
    }

    function renderMarkdown(src) {
      const lines = src.split("\n");
      const out = [];
      let i = 0;
      const isUl = (l) => /^\s*[-*+]\s+/.test(l);
      const isOl = (l) => /^\s*\d+[.)]\s+/.test(l);
      const isH = (l) => /^#{1,6}\s+/.test(l);
      const isFence = (l) => /^\s*```/.test(l);
      // A GFM table is a header row plus a dash-delimiter row (:--: cells set
      // alignment); isTableStart peeks at the next line so the header isn't
      // swallowed by the paragraph branch.
      const isTableSep = (l) => /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(l);
      const isTableStart = (idx) =>
        idx + 1 < lines.length && lines[idx].includes("|") && isTableSep(lines[idx + 1]);
      const splitRow = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "")
        .split(/(?<!\\)\|/).map((c) => c.replace(/\\\|/g, "|").trim());
      while (i < lines.length) {
        const line = lines[i];
        if (isFence(line)) {
          const buf = [];
          i++;
          while (i < lines.length && !isFence(lines[i])) { buf.push(lines[i]); i++; }
          i++; // consume the closing fence (or fall off EOF)
          out.push('<pre class="md-pre"><code>' + escapeHtml(buf.join("\n")) + "</code></pre>");
        } else if (isH(line)) {
          const m = line.match(/^(#{1,6})\s+(.*)$/);
          out.push('<div class="md-h md-h' + m[1].length + '">' + renderInline(m[2]) + "</div>");
          i++;
        } else if (isUl(line)) {
          const items = [];
          while (i < lines.length && isUl(lines[i])) {
            items.push("<li>" + renderInline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>");
            i++;
          }
          out.push('<ul class="md-ul">' + items.join("") + "</ul>");
        } else if (isOl(line)) {
          const items = [];
          while (i < lines.length && isOl(lines[i])) {
            items.push("<li>" + renderInline(lines[i].replace(/^\s*\d+[.)]\s+/, "")) + "</li>");
            i++;
          }
          out.push('<ol class="md-ol">' + items.join("") + "</ol>");
        } else if (isTableStart(i)) {
          const header = splitRow(line);
          const aligns = splitRow(lines[i + 1]).map((c) => {
            const l = c.startsWith(":"), r = c.endsWith(":");
            return l && r ? "center" : r ? "right" : "left";
          });
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim() && lines[i].includes("|") && !isFence(lines[i])) {
            rows.push(splitRow(lines[i])); i++;
          }
          const cell = (tag, txt, x) =>
            "<" + tag + ' style="text-align:' + (aligns[x] || "left") + '">' + renderInline(txt || "") + "</" + tag + ">";
          const thead = "<thead><tr>" + header.map((c, x) => cell("th", c, x)).join("") + "</tr></thead>";
          const tbody = "<tbody>" + rows.map((r) =>
            "<tr>" + header.map((_, x) => cell("td", r[x] || "", x)).join("") + "</tr>").join("") + "</tbody>";
          out.push('<div class="md-tw"><table class="md-table">' + thead + tbody + "</table></div>");
        } else if (!line.trim()) {
          i++; // blank line — paragraph separator
        } else {
          const para = [];
          while (i < lines.length && lines[i].trim()
              && !isFence(lines[i]) && !isH(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])
              && !isTableStart(i)) {
            para.push(lines[i]);
            i++;
          }
          out.push('<p class="md-p">' + para.map(renderInline).join("<br>") + "</p>");
        }
      }
      return out.join("");
    }

    // Paint the turn body. Collapsed (or full text not yet fetched) → the plain
    // single-line excerpt. Expanded with the full turn cached for this same `at`
    // → the markdown-rendered full text. A signature guard skips no-op repaints
    // so steady polling never re-parses an unchanged turn.
    function paintTurn(t, text, rich) {
      const sig = (rich ? "md␀" : "tx␀") + text;
      if (t.dataset.sig === sig) return;
      t.dataset.sig = sig;
      // Both paths escape-then-format, so **bold** and `code` render even on the
      // collapsed one-liner instead of showing literal markers.
      t.innerHTML = rich ? renderMarkdown(text) : renderInline(text);
    }
    function paintTurnFor(el, hash) {
      const t = el.querySelector(".ttext");
      if (!t) return;
      const cached = turnCache.get(hash);
      const have = cached && cached.at === (el.dataset.turnAt || "");
      const rich = el.classList.contains("expanded") && have && !!cached.text;
      paintTurn(t, rich ? cached.text : (t.dataset.excerpt || ""), rich);
    }

    function buildCard(hash) {
      const el = document.createElement("div");
      el.className = "card";
      el.dataset.hash = hash;
      el.innerHTML = `
        <button class="forget" title="Forget this session">×</button>
        <div class="forget-confirm" hidden>
          <span class="fc-label">Forget?</span>
          <button class="fc-yes" type="button">Forget</button>
          <button class="fc-no" type="button">Keep</button>
        </div>
        <span class="attn-flag">waiting<span class="wait-time"></span></span>
        <div class="head">
          <span class="dot"></span>
          <img class="icon" alt="" hidden>
          <span class="label"><span class="project"></span><span class="task"></span></span>
        </div>
        <div class="turn" hidden><span class="tglyph"></span><span class="ttext"></span></div>
        <div class="tacks" hidden></div>
        <div class="desc"></div>
        <dl class="details">
          <div class="kv"><dt>cwd</dt><dd class="cwd"></dd><button class="copy" title="Copy cwd"></button></div>
          <div class="kv kv-branch"><dt>branch</dt><dd class="branch-d"></dd><button class="copy" title="Copy branch"></button></div>
          <div class="kv"><dt>session</dt><dd class="sess"></dd><button class="copy" title="Copy session id"></button></div>
        </dl>
        <div class="foot">
          <span class="chev" aria-hidden="true">⌄</span>
          <div class="sub">
            <span class="route"></span>
            <span class="age"></span>
          </div>
          <button class="go" hidden>go <span class="arr">→</span></button>
        </div>`;
      el.addEventListener("click", (e) => {
        if (e.target.closest("a")) return; // let a rendered link open; don't toggle
        if (openForget) { closeForgetConfirm(); return; } // a click-away dismisses the fly-out
        // A card behind the front of its z-stack: click raises it, doesn't expand.
        if (!el.classList.contains("front")) { raiseStack(el.dataset.project, hash); return; }
        if (el.classList.toggle("expanded")) fetchFull(hash);
        paintTurnFor(el, hash); // switch the body to/from rendered markdown now
      });
      // Keyboard reach for stacked-behind cards (tab to a peeking card, Enter to
      // raise) — the accessible path to the same raise the click above does.
      el.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && !el.classList.contains("front")) {
          e.preventDefault();
          raiseStack(el.dataset.project, hash);
        }
      });
      el.addEventListener("mouseenter", () => showStackTip(el)); // preview a peeking card
      el.addEventListener("mouseleave", hideStackTip);
      el.querySelector(".go").addEventListener("click", (e) => {
        e.stopPropagation();
        focus(hash);
      });
      // The waiting pill is a second affordance for the same focus action as
      // go — a big click target on the card's loudest element. Gated on
      // focusability like go (dataset set at render), so a non-focusable
      // blocked card's pill stays an inert label, not a dead button.
      el.querySelector(".attn-flag").addEventListener("click", (e) => {
        if (el.dataset.focusable !== "true") return;
        e.stopPropagation();
        focus(hash);
      });
      el.querySelector(".forget").addEventListener("click", (e) => {
        e.stopPropagation();
        openForgetConfirm(el);
      });
      el.querySelector(".fc-yes").addEventListener("click", (e) => {
        e.stopPropagation();
        closeForgetConfirm();
        forget(hash);
      });
      el.querySelector(".fc-no").addEventListener("click", (e) => {
        e.stopPropagation();
        closeForgetConfirm();
      });
      el.querySelectorAll(".copy").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation(); // copy, don't toggle expand
          const dd = btn.parentElement.querySelector("dd");
          const val = dd ? dd.textContent.trim() : "";
          if (!val || val === "—") return;
          try {
            await navigator.clipboard.writeText(val);
            btn.classList.add("copied");
            setTimeout(() => btn.classList.remove("copied"), 1200);
          } catch (_) { /* clipboard unavailable */ }
        });
      });
      return el;
    }

    function setText(el, sel, value) {
      const node = el.querySelector(sel);
      const v = value || "";
      if (node.textContent !== v) node.textContent = v;
    }

    // The description carries beacon's status-overlay formatting — _italic_ and
    // newlines for a second line (e.g. "Shipping\n_Phase 3: release_"). The
    // iTerm2 pane badge honors those; render them here too rather than showing
    // the raw markers. Escape-first via renderInline, with underscore-italic on.
    // A paused card needs no || text glyph (WIP-12): the mode-card watermark is
    // the dashboard's pause cue — the analog of the pane's paused background.
    // The || prefix stays in the text-only fleet views (wip table, watch).
    function renderDescHtml(description) {
      return description ? renderInline(description, true).replace(/\n/g, "<br>") : "";
    }

    // Bound-tack references (WIP-09): the change requests / issues / other the
    // session is driving. Chips ordered by emphasis (cr → issue → other) and
    // deduped by URL; rebuilt only when the set changes (signature guard) so
    // steady polling doesn't churn the DOM.
    const REF_RANK = { cr: 0, issue: 1, other: 2 };
    function renderTacks(el, s) {
      const wrap = el.querySelector(".tacks");
      const chips = [];
      for (const t of (s.tacks || [])) {
        const refs = t.refs || [];
        const summary = t.summary || t.tack_id || "tack";
        if (refs.length) {
          for (const r of refs) chips.push({ type: r.type || "other", url: r.url || "", summary });
        } else {
          chips.push({ type: "other", url: "", summary }); // emerging tack — no link yet
        }
      }
      chips.sort((a, b) => (REF_RANK[a.type] ?? 3) - (REF_RANK[b.type] ?? 3));
      const seen = new Set();
      const uniq = chips.filter((c) => {
        const k = c.url || "sum:" + c.summary;
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      const sig = JSON.stringify(uniq.map((c) => [c.type, c.url, c.summary]));
      if (wrap.dataset.sig === sig) return;
      wrap.dataset.sig = sig;
      wrap.replaceChildren(...uniq.map(tackChip));
      wrap.hidden = uniq.length === 0;
    }

    function tackChip(c) {
      const el = document.createElement(c.url ? "a" : "span");
      el.className = "tref " + c.type;
      if (c.url) {
        el.href = c.url;
        el.target = "_blank";
        el.rel = "noopener";
        el.addEventListener("click", (e) => e.stopPropagation()); // open link, don't toggle expand
      }
      const num = (c.url.match(/(\d+)\D*$/) || [])[1] || "";
      let glyph, label;
      if (c.type === "cr") {
        glyph = "⇅"; label = (/\/-\/merge_requests\//.test(c.url) ? "MR " : "PR ") + num;
      } else if (c.type === "issue") {
        glyph = "◇"; label = "#" + num;
      } else {
        glyph = c.url ? "↗" : "•"; label = c.summary;
      }
      const g = document.createElement("span"); g.className = "tg"; g.textContent = glyph;
      const l = document.createElement("span"); l.className = "tl"; l.textContent = label;
      el.append(g, l);
      el.title = c.summary && c.summary !== label ? label + " · " + c.summary : label;
      return el;
    }

    function updateCard(el, s) {
      el.classList.remove(...STATES.map((x) => "state-" + x));
      el.classList.add("state-" + (s.state || "ready"));
      // Waiting-for-you emphasis (these cards live in the pinned needs-you band,
      // placeAttention). Amber (soft) attention = flagged but not a live block;
      // red = blocked now.
      el.classList.toggle("needs-you", needsYou(s));
      el.classList.toggle("soft-attn", s.state !== "blocked" && !!s.pending_attention);
      el.dataset.focusable = s.focusable ? "true" : "false";
      el.title = "Click to expand";
      const go = el.querySelector(".go");
      go.hidden = !s.focusable;
      go.title = "Raise this iTerm2 window";

      setText(el, ".project", s.project || s.hash);
      setText(el, ".task", s.task || "");

      // The project icon (PROV-08/WIP-08) stands in for the status dot when the
      // project ships one; the top bar keeps carrying the status color.
      const dot = el.querySelector(".dot"), icon = el.querySelector(".icon");
      if (s.icon) {
        if (icon.getAttribute("src") !== s.icon) icon.src = s.icon;
        icon.hidden = false; dot.hidden = true;
      } else {
        icon.hidden = true; dot.hidden = false;
      }

      // /color: fill the project+task label background with the session's color.
      if (s.agent_color) {
        const c = resolveColor(s.agent_color);
        el.classList.add("has-color");
        el.style.setProperty("--agent-color", c.css);
        el.style.setProperty("--agent-fg", c.fg);
      } else {
        el.classList.remove("has-color");
        el.style.removeProperty("--agent-color");
        el.style.removeProperty("--agent-fg");
      }

      const turn = el.querySelector(".turn");
      const lt = s.latest_turn;
      if (lt && lt.text) {
        const glyph = lt.role === "human" ? "›" : "↳";
        const g = turn.querySelector(".tglyph"), t = turn.querySelector(".ttext");
        if (g.textContent !== glyph) g.textContent = glyph;
        el.dataset.turnAt = lt.at || "";
        t.dataset.excerpt = lt.text; // collapsed one-liner + expand fallback
        turn.dataset.role = lt.role || "";
        turn.hidden = false;
        // Paint from the excerpt, or the markdown-rendered full turn when expanded
        // and cached for this same `at`.
        paintTurnFor(el, s.hash);
        // `have` is set even on a failed fetch (negative cache), so a 404 fetches
        // once per turn, not every poll; a newer turn (changed `at`) invalidates
        // it and refetches once.
        const cached = turnCache.get(s.hash);
        const have = cached && cached.at === (lt.at || "");
        if (el.classList.contains("expanded") && !have) fetchFull(s.hash);
      } else {
        turn.hidden = true;
      }

      renderTacks(el, s);

      setText(el, ".wait-time", s.age_seconds != null ? fmtAge(s.age_seconds) : "");
      const descEl = el.querySelector(".desc");
      const descHtml = renderDescHtml(s.description);
      if (descEl.dataset.html !== descHtml) { descEl.dataset.html = descHtml; descEl.innerHTML = descHtml; }
      // Show the route only when it carries signal the project doesn't — a
      // route resolved by matching the project just echoes the title (mirrors
      // _watch_frame_lines' echoes_project in scripts/beacon).
      const proj = (s.project || "").toLowerCase();
      const rt = (s.route || "").toLowerCase();
      const echoesProject = !rt || rt === proj || rt === proj.split("/").pop();
      setText(el, ".route", !echoesProject && s.route ? "[" + s.route + "]" : "");
      setText(el, ".age", fmtAge(s.age_seconds));

      // Expand-only detail. `session` is the Claude session id (what you'd pass
      // to `claude --resume`), falling back to the beacon hash for non-Claude
      // panes. Branch repeats the footer's glance value but carries a copy
      // affordance the footer lacks.
      setText(el, ".cwd", s.cwd || "—");
      setText(el, ".branch-d", s.branch || "");
      el.querySelector(".kv-branch").hidden = !s.branch;
      setText(el, ".sess", s.session || s.hash || "");
    }

    // Place `list` into `container` as per-project z-stacks (WIP-10: same-project
    // sessions collapse into one overlapping stack, newest in front). `list`
    // arrives urgency-then-recency sorted, so first-appearance order gives each
    // project's slot the priority of its most urgent/fresh member. Stacks and
    // cards are reused/moved, never rebuilt — insertBefore reparents for free, so
    // a session moving bands or a stack changing group is a cheap move and
    // animations / expand state survive (buffer-dom-rerenders). `stackStore` is
    // the group's own project->stack map, so a project can't collide across groups.
    function place(container, list, stackStore) {
      const order = [];
      const byProject = new Map();
      for (const s of list) {
        const k = s.project || s.hash;
        if (!byProject.has(k)) { byProject.set(k, []); order.push(k); }
        byProject.get(k).push(s);
      }
      let prev = null;
      const seen = new Set();
      for (const k of order) {
        seen.add(k);
        let stack = stackStore.get(k);
        if (!stack) {
          stack = document.createElement("div");
          stack.className = "stack";
          stackStore.set(k, stack);
        }
        placeStack(stack, k, byProject.get(k));
        const anchor = prev ? prev.nextSibling : container.firstChild;
        if (stack.parentNode !== container || stack !== anchor) {
          container.insertBefore(stack, anchor);
        }
        prev = stack;
      }
      for (const [k, stack] of stackStore) {
        if (!seen.has(k)) { stack.remove(); stackStore.delete(k); }
      }
    }

    // Order one project's sessions within its stack: the user-raised session (or
    // else the newest) sits in front; the rest recede by recency, offset via
    // --depth (see .stack.stacked CSS). Only the front card expands/focuses on a
    // plain click; a peeking card raises to front instead (buildCard handlers).
    function placeStack(stack, project, sessions) {
      const ranked = [...sessions].sort(byRank); // waiting-then-newest in front
      const raisedHash = raised.get(project);
      let front = ranked.find((s) => s.hash === raisedHash);
      if (!front) {
        raised.delete(project);
        // An expanded card holds the front slot so a sibling's newer turn can't
        // demote it — a demoted card is collapsed below, which would yank away
        // what the user is reading mid-poll.
        front = ranked.find((s) => cards.get(s.hash)?.classList.contains("expanded"))
          || ranked[0];
      }
      const ordered = [front, ...ranked.filter((s) => s !== front)];

      const stacked = ordered.length > 1;
      stack.classList.toggle("stacked", stacked);
      stack.title = stacked
        ? ordered.length + " " + project + " sessions — click a peeking card to raise it"
        : "";

      let prev = null;
      ordered.forEach((s, i) => {
        let el = cards.get(s.hash);
        if (!el) { el = buildCard(s.hash); cards.set(s.hash, el); }
        updateCard(el, s);
        el.dataset.project = project;
        el.classList.toggle("front", i === 0);
        el.style.setProperty("--depth", Math.min(i, 2)); // cap the peek offset
        if (i !== 0) el.classList.remove("expanded"); // only the front card expands
        if (stacked && i !== 0) {
          el.tabIndex = 0;
          el.setAttribute("aria-label", "Raise this " + project + " session to the front");
          // A peeking card's content is hidden under the front — its task + latest
          // turn drive the custom hover tooltip (showStackTip). Clear the native
          // title so updateCard's "Click to expand" doesn't compete.
          el.dataset.preview = [s.task, s.latest_turn && s.latest_turn.text].filter(Boolean).join(" — ") || "Raise this session";
          el.title = "";
        } else {
          el.removeAttribute("tabindex");
          el.removeAttribute("aria-label");
          delete el.dataset.preview;
        }
        const anchor = prev ? prev.nextSibling : stack.firstChild;
        if (el.parentNode !== stack || el !== anchor) stack.insertBefore(el, anchor);
        prev = el;
      });
    }

    // Pull a stacked-behind session to the front of its project stack, then
    // re-render so placement honors it. Persists via `raised` across polls.
    function raiseStack(project, hash) {
      if (!project) return;
      raised.set(project, hash);
      if (latest) render(latest);
    }

    const ageOf = (s) => s.age_seconds ?? 1e12;

    // The one ordering rule, used everywhere sessions are sorted: a waiting /
    // flagged session always ranks as "newer" than an ordinary update (the
    // guarantee that a blocked session surfaces), then ties break by real
    // recency. So a waiting session is never buried behind a fresher idle one.
    const byRank = (a, b) =>
      (Number(needsYou(b)) - Number(needsYou(a))) || (ageOf(a) - ageOf(b));

    // Sentinel group for sessions carrying no route-group signal — rendered
    // headerless and always last (silent degrade, no "ungrouped" label).
    const NO_GROUP = "␀nogroup";

    // Partition the fleet into ordered groups by the route-group signal. A group
    // with a signal gets a labeled header; sessions without one fall into the
    // NO_GROUP bucket, which renders headerless and sorts to the bottom. Within a
    // group, byRank orders; groups float by their freshest member.
    function computeGroups(list) {
      const map = new Map();
      for (const s of list) {
        const k = s.route_group || NO_GROUP;
        (map.get(k) || map.set(k, []).get(k)).push(s);
      }
      const groups = [...map.entries()].map(([key, sessions]) => {
        sessions.sort(byRank);
        return {
          key, hasGroup: key !== NO_GROUP, label: key === NO_GROUP ? "" : key,
          sessions, minAge: Math.min(...sessions.map(ageOf)),
        };
      });
      groups.sort((a, b) =>
        (Number(a.key === NO_GROUP) - Number(b.key === NO_GROUP)) // groupless last
        || (a.minAge - b.minAge));
      return groups;
    }

    // Render the grouped view, reusing section wrappers and cards across renders
    // (buffer-dom-rerenders — cards are moved, never rebuilt, so animations and
    // expand state survive a regroup).
    function placeGroups(sessions) {
      const groups = computeGroups(sessions);
      const seen = new Set();
      let prevSection = null;
      for (const g of groups) {
        seen.add(g.key);
        let gs = groupSections.get(g.key);
        if (!gs) {
          const section = document.createElement("section");
          section.className = "group-section";
          section.innerHTML =
            '<div class="group-head"><span class="glabel"></span>' +
            '<span class="gn"></span><span class="grule"></span></div>' +
            '<div class="grid ggrid"></div>';
          gs = {
            section,
            grid: section.querySelector(".ggrid"),
            head: section.querySelector(".group-head"),
            stacks: new Map(), // project -> z-stack element, scoped to this group
          };
          groupSections.set(g.key, gs);
        }
        gs.head.hidden = !g.hasGroup;
        setText(gs.section, ".glabel", g.label);
        setText(gs.section, ".gn", String(g.sessions.length));
        const anchor = prevSection ? prevSection.nextSibling : groupsEl.firstChild;
        if (gs.section.parentNode !== groupsEl || gs.section !== anchor) {
          groupsEl.insertBefore(gs.section, anchor);
        }
        prevSection = gs.section;
        place(gs.grid, g.sessions, gs.stacks);
      }
      for (const [k, gs] of groupSections) {
        if (!seen.has(k)) { gs.section.remove(); groupSections.delete(k); }
      }
    }

    // Place sessions flat (no z-stack — the action queue must never hide one
    // waiting session behind another). Reuses the same card elements as the
    // fleet; a session that stops waiting is reparented out by placeGroups, one
    // that starts waiting is reparented in here (insertBefore moves the node).
    function placeFlat(container, list) {
      let prev = null;
      for (const s of list) {
        let el = cards.get(s.hash);
        if (!el) { el = buildCard(s.hash); cards.set(s.hash, el); }
        updateCard(el, s);
        el.classList.add("front");           // a band card is a top card: it expands
        el.style.removeProperty("--depth");  // on click, never raises (shed stack chrome)
        el.removeAttribute("tabindex");
        el.removeAttribute("aria-label");
        el.dataset.project = s.project || s.hash;
        const anchor = prev ? prev.nextSibling : container.firstChild;
        if (el.parentNode !== container || el !== anchor) container.insertBefore(el, anchor);
        prev = el;
      }
    }

    function placeAttention(list) {
      attnEl.hidden = list.length === 0;
      placeFlat(attnEl.querySelector(".attn-grid"), [...list].sort(byRank));
    }

    function render(payload) {
      const sessions = payload.sessions || [];
      const seen = new Set(sessions.map((s) => s.hash));

      // Waiting/flagged sessions are hoisted OUT of the fleet into the pinned top
      // band; the grouped fleet below shows only the calm rest (WIP-10).
      placeAttention(sessions.filter(needsYou));
      placeGroups(sessions.filter((s) => !needsYou(s)));

      for (const [hash, el] of cards) {
        if (!seen.has(hash)) { el.remove(); cards.delete(hash); }
      }

      document.getElementById("empty").hidden = sessions.length > 0;
    }

    // Enrich an expanded card with the full turn text (WIP-14). Cached by turn
    // timestamp so re-expanding the same turn is free; a failed fetch simply
    // leaves the excerpt in place (the collapsed content is never worse).
    async function fetchFull(hash) {
      const el = cards.get(hash);
      const at = el ? (el.dataset.turnAt || "") : "";
      try {
        const r = await fetch("/turn/" + hash, { cache: "no-store" });
        if (!r.ok) { turnCache.set(hash, { at, text: null }); return; }
        const j = await r.json();
        turnCache.set(hash, { at: j.at || at, text: j.text || null });
        if (el && el.classList.contains("expanded") && j.text) paintTurnFor(el, hash);
      } catch (e) { turnCache.set(hash, { at, text: null }); } // negative cache
    }

    async function focus(hash) {
      try {
        const r = await fetch("/focus", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hash }),
        });
        const j = await r.json();
        if (!j.focused) flashError("Focus failed: " + (j.detail || "unknown"));
      } catch (e) { flashError("Focus request failed"); }
    }

    // The card whose inline forget-confirm fly-out is open (at most one). A
    // background click (the document listener) or Esc dismisses it; the card's
    // own handlers stopPropagation so opening/confirming don't self-dismiss.
    let openForget = null;
    function openForgetConfirm(el) {
      if (openForget === el) { closeForgetConfirm(); return; } // second × click toggles off
      closeForgetConfirm();
      el.querySelector(".forget-confirm").hidden = false;
      el.classList.add("confirming");
      openForget = el;
    }
    function closeForgetConfirm() {
      if (!openForget) return;
      openForget.classList.remove("confirming");
      const fc = openForget.querySelector(".forget-confirm");
      if (fc) fc.hidden = true;
      openForget = null;
    }
    document.addEventListener("click", closeForgetConfirm);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeForgetConfirm(); });

    // Hover preview for peeking cards: one shared fixed tooltip on <body> (escapes
    // the card's overflow:hidden), positioned under the hovered behind-card.
    const stackTip = document.createElement("div");
    stackTip.id = "stack-tip";
    stackTip.hidden = true;
    document.body.appendChild(stackTip);
    function showStackTip(el) {
      if (el.classList.contains("front") || !el.dataset.preview) return;
      stackTip.textContent = el.dataset.preview;
      stackTip.hidden = false;
      const r = el.getBoundingClientRect();
      const w = stackTip.offsetWidth;
      stackTip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
      stackTip.style.top = Math.min(r.bottom + 6, window.innerHeight - stackTip.offsetHeight - 8) + "px";
    }
    function hideStackTip() { stackTip.hidden = true; }
    window.addEventListener("scroll", hideStackTip, true); // fixed tip goes stale on scroll

    async function forget(hash) {
      try {
        await fetch("/forget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ hash }),
        });
        const el = cards.get(hash);
        if (el) { el.remove(); cards.delete(hash); }
      } catch (e) { flashError("Forget request failed"); }
    }

    let errTimer = null;
    function flashError(msg) {
      const e = document.getElementById("err");
      e.textContent = msg;
      e.style.display = "block";
      clearTimeout(errTimer);
      errTimer = setTimeout(() => { e.style.display = "none"; }, 4000);
    }

    let scheduled = false, latest = null;
    function schedule(payload) {
      latest = payload;
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(() => { scheduled = false; render(latest); });
    }

    let inFlight = false;
    async function poll() {
      if (inFlight) return;
      inFlight = true;
      try {
        const r = await fetch("/wip.json", { cache: "no-store" });
        const payload = await r.json();
        schedule(payload);
        const ts = payload.generated_at ? new Date(payload.generated_at) : new Date();
        document.getElementById("freshness").innerHTML =
          'updated <span class="live">' + ts.toLocaleTimeString() + "</span>";
      } catch (e) {
        document.getElementById("freshness").innerHTML =
          '<span class="stale">⚠ serve unreachable — is `beacon serve` running?</span>';
      } finally { inFlight = false; }
    }

    poll();
    setInterval(poll, POLL_MS);
  </script>
</body>
</html>
