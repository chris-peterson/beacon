name: Project

# Every generated artifact has one writer, and it is this job. shipyard's
# project action regenerates .claude-plugin/plugin.json, hooks/hooks.json, and
# plugin.yml's suite.describe block from their sources and commits the result to
# the branch, so a committed artifact matches its source at all times and the
# diff a reviewer approves is the change that lands.
#
# No build step: beacon declares no `cli:` block, so nothing projected here has
# to be built first — the projection runs against the sources alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The default pull_request checkout leaves a merge commit in detached
          # HEAD, and there is no branch there to push a projection to.
          ref: ${{ github.head_ref }}

      - uses: chris-peterson/shipyard/actions/project@v2
