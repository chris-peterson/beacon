name: Tests

# Cross-platform check. The sessions view (wip / serve) and the plugin hooks are
# pure-stdlib Python meant to run on any OS; the iTerm2 pane-painting paths are
# mocked in the suite (sys.platform, _cli), so the same tests exercise the
# Windows and Linux fallbacks (session-id seeding, watch polling) without a Mac.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v
