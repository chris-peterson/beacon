name: Tests

# Cross-platform check. The sessions view (wip / serve) and the plugin hooks are
# pure-stdlib Python meant to run on any OS; the iTerm2 pane-painting paths are
# mocked in the suite (sys.platform, _cli), so the same tests exercise the
# Windows and Linux fallbacks (session-id seeding, watch polling) without a Mac.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # '3.x' is the newest stable Python, so a new release is tested when it ships.
        include:
          - { os: ubuntu-24.04,   python-version: '3.9'  }  # newest Ubuntu with a 3.9 build
          - { os: ubuntu-latest,  python-version: '3.11' }
          - { os: ubuntu-latest,  python-version: '3.13' }
          - { os: ubuntu-latest,  python-version: '3.x'  }
          - { os: macos-latest,   python-version: '3.9'  }
          - { os: macos-latest,   python-version: '3.11' }
          - { os: macos-latest,   python-version: '3.13' }
          - { os: macos-latest,   python-version: '3.x'  }
          - { os: windows-latest, python-version: '3.9'  }
          - { os: windows-latest, python-version: '3.11' }
          - { os: windows-latest, python-version: '3.13' }
          - { os: windows-latest, python-version: '3.x'  }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v
