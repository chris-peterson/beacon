# Canonical descriptor for the beacon plugin — edit here, never plugin.json.
# shipyard projects this into .claude-plugin/plugin.json and the marketplace
# catalog (the suite: block). suite.describe is generated from the
# skills/rules/hooks sources — run `just build`, don't hand-edit it.

name: beacon
version: 2.1.0
description: At-a-glance awareness across concurrent Claude Code sessions — a terminal-agnostic fleet dashboard plus iTerm2 per-pane painting.
author: chris-peterson
repository: https://github.com/chris-peterson/beacon
icon: docs/favicon.svg
license: MIT
keywords: [dashboard, session-management, fleet, cross-platform, workflow, iterm2, macos]

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/beacon/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: true
  group: bearings
  dependencies:
    - name: tack
      required: false
      reason: resolves the branch's CR/PR URL for the badge link
  # Activated by agent events (session hooks on Stop), user prompts, and
  # session start.
  activations: [agent, user, session]
  gloss: A lighthouse you can read from across the harbor.
  pitch: "Running several Claude windows? Each gets a badge showing whether it's working or waiting for you."
  with: tack
  what: "Puts a colored badge on each terminal window so you can tell what every Claude session is doing at a glance: a neutral gray at rest, amber working, red waiting for you. The badge is iTerm2 on macOS; on any OS or terminal the same state shows in a fleet dashboard you open in a browser. Look away and still know which window needs you."
  cmds:
    - ["/beacon:beacon", "Label a pane, or set status with a note"]
    - ["/beacon:session-mode", "Set the session mode — pause, release, retro, done"]
    - ["beacon", "Read the resolved project / task / status anywhere"]
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      beacon: Label a session's project/task on the iTerm2 badge, and check the beacon CLI wrapper is current on first use per session.
    rules:
      keep-session-labeled: Keep this session's beacon work label current
    hooks:
      cli-freshness: SessionStart — Detects CLI wrapper drift after a plugin update.
      emit-rules: SessionStart — Emits this plugin's ambient rules into context.
      hooks: 'Hook wiring: SessionStart→beacon CLI, cli-freshness, emit-rules; UserPromptSubmit→beacon CLI; Stop→beacon CLI; SessionEnd→beacon CLI; Notification→beacon CLI (permission_prompt, idle_prompt); PreToolUse→beacon CLI; PostToolUse→beacon CLI.'
    commands:
      beacon: Show or set session beacon signals (project, task, status)
      session-mode: Set this session's beacon mode — release, retro, pause, done, or resume — with an optional note
  # <<< shipyard:describe <<<

docs:
  code_languages: [bash, yaml, python, json]
  mermaid: true
