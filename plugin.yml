# Canonical descriptor for the beacon plugin — edit here, never plugin.json.
# shipyard projects this into .claude-plugin/plugin.json and the marketplace
# catalog (the suite: block). suite.describe is generated from the
# skills/rules/hooks sources — run `just build`, don't hand-edit it.

name: beacon
version: 2.7.0
description: At-a-glance awareness across concurrent Claude Code sessions — a terminal-agnostic sessions view plus iTerm2 per-pane painting.
author: chris-peterson
repository: https://github.com/chris-peterson/beacon
icon: docs/favicon.svg
license: MIT
keywords: [dashboard, session-management, sessions, cross-platform, workflow, iterm2, macos]

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It is a pointer to AGENTS.md plus the @AGENTS.md ref
        that loads it.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/beacon/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: true
  group: bearings
  dependencies:
    - name: tack
      required: false
      reason: supplies the routes the sessions view joins a session to, and the deliverables its status line lists
  # Activated by agent events (session hooks on Stop), user prompts, and
  # session start.
  activations: [agent, user, session]
  gloss: A lighthouse you can read from across the harbor.
  pitch: "Running several Claude windows? Each tab shows whether it's working or waiting for you."
  with: tack
  what: "Colors each session's tab so you can tell what every Claude session is doing at a glance: a neutral gray at rest, amber working, red waiting for you. The tab is labeled with the project and the task under it. That's iTerm2 on macOS; on any OS or terminal the same state shows in a dashboard you open in a browser. Look away and still know which window needs you."
  cmds:
    - ["/beacon:pause", "Park this session, with an optional note"]
    - ["/beacon:install-beacon", "Bootstrap or refresh the wrapper, completions, and profiles"]
    - ["beacon", "Read the resolved project / task / mode / activity anywhere"]
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    rules:
      keep-session-labeled: Keep this session's beacon work label current
    hooks:
      cli-freshness: SessionStart — Detects CLI wrapper drift after a plugin update.
      emit-rules: SessionStart — Emits this plugin's ambient rules into context.
      hooks: 'Hook wiring: SessionStart→beacon CLI, cli-freshness, emit-rules; UserPromptSubmit→beacon CLI; Stop→beacon CLI; SessionEnd→beacon CLI; Notification→beacon CLI (permission_prompt, idle_prompt); PreToolUse→beacon CLI; PostToolUse→beacon CLI.'
    commands:
      install-beacon: Bootstrap or refresh beacon's wrapper, completions, status line, and iTerm2 profiles
      pause: Park this session's beacon — enter pause mode, with an optional note
  # <<< shipyard:describe <<<

docs:
  code_languages: [bash, yaml, python, json]
  mermaid: true
