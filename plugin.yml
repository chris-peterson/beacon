# Canonical descriptor for the beacon plugin — edit here, never plugin.json.
# shipyard projects this into .claude-plugin/plugin.json and the marketplace
# catalog (the suite: block). suite.describe is generated from the
# skills/rules/hooks sources — run `just build`, don't hand-edit it.

name: beacon
version: 1.25.0
description: At-a-glance awareness across concurrent Claude Code sessions — a terminal-agnostic fleet dashboard plus iTerm2 per-pane painting.
author: chris-peterson
repository: https://github.com/chris-peterson/beacon
icon: docs/favicon.svg
license: MIT
keywords: [dashboard, session-management, fleet, cross-platform, workflow, iterm2, macos]

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/beacon/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  cli: true
  group: bearings
  dependencies:
    - name: tack
      required: false
      reason: resolves the branch's CR/PR URL for the badge link
    - name: moor
      required: false
      reason: powers beacon review — the branch-vs-default diff and its sidecar feedback
    - name: anchor
      required: false
      reason: beacon review delegates to its review-diff.sh for working-tree review on the default branch
  # Activated by agent events (session hooks on Stop), user prompts, and
  # session start.
  activations: [agent, user, session]
  gloss: A lighthouse you can read from across the harbor.
  pitch: "Running several Claude windows? Each gets a badge showing whether it's working or waiting for you."
  with: tack
  what: "Puts a colored badge on each terminal window so you can tell what every Claude session is doing at a glance: a neutral gray at rest, amber working, red waiting for you. The badge is iTerm2 on macOS; on any OS or terminal the same state shows in a fleet dashboard you open in a browser. Look away and still know which window needs you."
  cmds:
    - ["/beacon:beacon", "Label a pane, or set status with a note"]
    - ["/beacon:pause", "Park this session fast — status paused, optional note"]
    - ["beacon", "Read the resolved project / task / status anywhere"]
    - ["beacon review", "Review the branch vs its default (moor-aware) — or click ⇄ review"]
  # Skill-anchored previews shown live on the docs site; the session: below is
  # the at-a-glance flow the hub also reads.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      beacon: Label a session's project/task on the iTerm2 badge, and check the beacon CLI wrapper is current on first use per session.
    rules:
      keep-session-labeled: Keep this session's beacon work label current
    hooks:
      cli-freshness: SessionStart — Detects CLI wrapper drift after a plugin update.
      emit-rules: SessionStart — Emits this plugin's ambient rules into context.
      hooks: 'Hook wiring: SessionStart→beacon CLI, cli-freshness, emit-rules; UserPromptSubmit→beacon CLI; Stop→beacon CLI; SessionEnd→beacon CLI; Notification→beacon CLI; PreToolUse→beacon CLI; PostToolUse→beacon CLI.'
    commands:
      beacon: Show or set session beacon signals (project, task, status)
      done: Mark this session complete — set status to done (ready to hand off to another session), with an optional note
      pause: Pause this session's beacon — set status to paused, with an optional note
      release: Enter release mode for this session — set status to release (ship-it flow in progress), with an optional note
      retro: Enter retro mode for this session — set status to retro (post-work follow-up/retro), with an optional note
  # <<< shipyard:describe <<<
  examples:
    - label: "/beacon:beacon"
      ac: "--orange"
      frames:
        - { t: you, text: "/beacon:beacon set project ai-sdlc task perms" }
        - { t: claude, text: "Labeled this pane. The badge now reads ai-sdlc: perms, so you can pick it out across windows." }
        - { t: status, text: "paints the per-pane badge and status bar in iTerm2" }
    - label: "beacon wip"
      ac: "--cyan"
      frames:
        - { t: you, text: "beacon wip" }
        - { t: claude, text: "Three sessions active: two working, one waiting on you. Window 3 has been red while you were heads-down elsewhere." }
        - { t: status, text: "scans every session's state — no iTerm2 required" }
  session:
    - { t: note, text: "Three Claude windows running; you're heads-down in one." }
    - { t: event, text: "a glance across the windows" }
    - { t: status, text: "window 3  ● red — it has been waiting for you while you weren't looking." }
